org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.parallel=true
org.gradle.caching=true

# Compile Kotlin in the Gradle process instead of a separate daemon: the Kotlin
# compile daemon can't connect in this environment and Gradle already falls back
# to in-process, so this just makes it explicit and removes the failed retries.
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official

android.useAndroidX=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
